spring.application.name=oficioya-service
spring.profiles.default=dev
server.port=${SERVER_PORT:8081}

app.jwt.secret=${JWT_SECRET:oficioya-service-secret-key-must-be-at-least-256-bits-long-1234567890}
app.jwt.issuer=oficioya
app.jwt.ttl-minutes=30

# Swagger UI / OpenAPI (en prod se desactiva desde application-prod.properties)
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true