spring.application.name=oficioya-service
spring.profiles.default=dev
server.port=${SERVER_PORT:8081}

app.jwt.secret=${JWT_SECRET:oficioya-service-secret-key-must-be-at-least-256-bits-long-1234567890}
app.jwt.issuer=oficioya
app.jwt.ttl-minutes=30

# Microservicio de notificaciones
notification.service.url=${NOTIFICATION_SERVICE_URL:http://localhost:8082}

logging.file.name=logs/ServicesService.log